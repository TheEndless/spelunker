<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Spelunker: a magnifying glass whose lens is a cave, lit by a headlamp beam that finds things. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4262"/>
      <stop offset="1" stop-color="#0c131c"/>
    </linearGradient>
    <radialGradient id="aura" cx="432" cy="424" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="170" y1="160" x2="700" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd985"/>
      <stop offset="0.55" stop-color="#f4a43c"/>
      <stop offset="1" stop-color="#d9791f"/>
    </linearGradient>
    <linearGradient id="handle" x1="640" y1="630" x2="850" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e98f2f"/>
      <stop offset="1" stop-color="#a65612"/>
    </linearGradient>
    <radialGradient id="cave" cx="540" cy="400" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b5d7a"/>
      <stop offset="0.6" stop-color="#1b3247"/>
      <stop offset="1" stop-color="#0a1420"/>
    </radialGradient>
    <linearGradient id="beam" x1="300" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0c0" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="510" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="432" cy="424" r="236"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#aura)"/>

  <g filter="url(#lift)">
    <line x1="644" y1="636" x2="846" y2="838" stroke="url(#handle)" stroke-width="112" stroke-linecap="round"/>
    <circle cx="432" cy="424" r="268" fill="url(#cave)" stroke="url(#ring)" stroke-width="72"/>
  </g>

  <g clip-path="url(#lens)">
    <circle cx="432" cy="424" r="236" fill="url(#cave)"/>
    <!-- stalactites hanging from the ceiling -->
    <path d="M180 160 L180 226 L214 226 L246 352 L284 232 L330 232 L352 330 L376 232 L430 232 L468 396 L510 232 L566 232 L596 330 L624 232 L668 232 L690 288 L710 232 L720 232 L720 160 Z" fill="#050a11"/>
    <!-- cave floor with stalagmites, its edge catching the light -->
    <g transform="translate(0 -36)">
    <path d="M180 660 L180 630 L236 612 L262 560 L292 618 L360 626 L392 586 L420 630 L500 634 L530 596 L560 636 L620 620 L650 574 L690 630 L720 640 L720 740 L180 740 Z" fill="#050a11"/>
    <path d="M236 612 L262 560 L292 618 L360 626 L392 586 L420 630 L500 634 L530 596 L560 636 L620 620 L650 574 L690 630" fill="none" stroke="#ffcf70" stroke-opacity="0.35" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- the beam -->
    <path d="M300 510 L700 318 L700 662 Z" fill="url(#beam)"/>
    <circle cx="300" cy="510" r="120" fill="url(#glow)"/>
    <circle cx="300" cy="510" r="23" fill="#fff6dc"/>
    <!-- lit stones where the beam lands -->
    <path d="M512 612 L546 546 L588 566 L604 620 Z" fill="#ffd27a" fill-opacity="0.55"/>
    <path d="M440 616 L462 574 L496 590 L500 622 Z" fill="#ffd27a" fill-opacity="0.4"/>
    <!-- sparkles: things found -->
    <path d="M540 410 L547 427 L564 434 L547 441 L540 458 L533 441 L516 434 L533 427 Z" fill="#fff6dc"/>
    <path d="M610 492 L614 502 L624 506 L614 510 L610 520 L606 510 L596 506 L606 502 Z" fill="#fff6dc" fill-opacity="0.9"/>
    <path d="M470 330 L474 340 L484 344 L474 348 L470 358 L466 348 L456 344 L466 340 Z" fill="#fff6dc" fill-opacity="0.8"/>
    <!-- glass highlight -->
    <path d="M236 330 A210 210 0 0 1 318 236" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
