[package]
name = "spelunker-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Spelunker: fast Windows file search that finds text inside files, matches names with wildcards or regex, and maps the results on a treemap"
keywords = ["search", "grep", "windows", "treemap", "tauri"]
categories = ["gui", "filesystem"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spelunker-core = { path = "../crates/spelunker-core" }
tauri-plugin-clipboard-manager = "2"
png = "0.18"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"
