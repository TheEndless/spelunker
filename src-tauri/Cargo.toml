[package]
name = "spelunker-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_UI_Shell"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spelunker-core = { path = "../crates/spelunker-core" }
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"
